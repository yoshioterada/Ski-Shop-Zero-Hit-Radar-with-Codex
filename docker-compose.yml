services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skishop}
      POSTGRES_USER: ${POSTGRES_USER:-skishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skishop-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skishop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skishop} -d ${POSTGRES_DB:-skishop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skishop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-skishop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-skishop-local-password}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-{noop}change-me}
      ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-PT8H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8080}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  skishop-postgres-data:
