services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skishop
      POSTGRES_USER: skishop
      POSTGRES_PASSWORD: skishop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skishop -d skishop"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skishop
      SPRING_DATASOURCE_USERNAME: skishop
      SPRING_DATASOURCE_PASSWORD: skishop
      ADMIN_USERNAME: admin@example.com
      ADMIN_PASSWORD: "{noop}change-me"
      AI_API_KEY: ""
      AI_MODEL: gpt-4.1-mini
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
